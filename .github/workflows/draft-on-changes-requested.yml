name: Draft on Changes Requested

on:
  # The workflow must run after "Record Changes Requested" completes, which
  # requires workflow_run.
  # zizmor: ignore[dangerous-triggers] the job only fetches a PR number artifact
  # from the triggering run by id and delegates to the reusable workflow
  workflow_run:
    workflows: ["Record Changes Requested"]
    types: [completed]

# A new "Record Changes Requested" completion for the same head branch cancels
# the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  get-pr:
    name: get-pr
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read  # download the pr-info artifact from the triggering run
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-info
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: pr
        run: echo "number=$(cat pr_number.txt)" >> "$GITHUB_OUTPUT"

  draft:
    name: draft
    needs: get-pr
    uses: DIRACGrid/.github/.github/workflows/draft-on-changes-requested.yml@a599200da5df9e3ea9104a6b9b99eb5bf83754a3
    with:
      pr_number: ${{ fromJSON(needs.get-pr.outputs.pr_number) }}
    secrets:
      token: ${{ secrets.DRAFT_PAT }}
